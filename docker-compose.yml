services:
  mysql:
    image: mysql:8.0
    container_name: connecthub-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports: ["3307:3306"]
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init-databases.sh:/docker-entrypoint-initdb.d/init.sh
    networks: [connecthub]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: apache/kafka:3.7.0
    container_name: connecthub-kafka
    expose: ["9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_LISTENERS: "PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    networks: [connecthub]
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-broker-api-versions.sh", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: connecthub-redis
    ports: ["6385:6379"]
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes: [redis_data:/data]
    networks: [connecthub]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  service-registry:
    image: ghcr.io/abhishek-puri-goswami/connecthub-backend/service-registry:latest
    build:
      context: .
      dockerfile: service-registry/Dockerfile
    container_name: connecthub-registry
    ports: ["8761:8761"]
    environment:
      EUREKA_USER: ${EUREKA_USER:-eureka}
      EUREKA_PASSWORD: ${EUREKA_PASSWORD}
      ADMIN_SERVER_HOST: admin-server
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    networks: [connecthub]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8761/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ── Spring Cloud Config Server ───────────────────────────────────────────────
  config-server:
    image: ghcr.io/abhishek-puri-goswami/connecthub-backend/config-server:latest
    build:
      context: .
      dockerfile: config-server/Dockerfile
    container_name: connecthub-config
    expose: ["8888"]
    environment:
      EUREKA_HOST: service-registry
      EUREKA_USER: ${EUREKA_USER:-eureka}
      EUREKA_PASSWORD: ${EUREKA_PASSWORD}
      CONFIG_SERVER_USER: ${CONFIG_SERVER_USER}
      CONFIG_SERVER_PASSWORD: ${CONFIG_SERVER_PASSWORD}
      CONFIG_REPO_URI: ${CONFIG_REPO_URI:-https://github.com/Abhishek-Puri-Goswami/ConnectHub-Config-Server.git}
      CONFIG_REPO_USERNAME: ${CONFIG_REPO_USERNAME:-}
      CONFIG_REPO_PASSWORD: ${CONFIG_REPO_PASSWORD:-}
    depends_on:
      service-registry: { condition: service_healthy }
    restart: on-failure
    networks: [connecthub]
    healthcheck:
      # wget --server-response prints the HTTP status line to stderr; redirect to stdout
      # and check for any valid HTTP response — even a 401 means the server is up.
      test: ["CMD-SHELL", "wget --server-response --quiet http://localhost:8888/actuator/health 2>&1 | head -1 | grep -q 'HTTP/'"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 30s

  # ── Spring Boot Admin ─────────────────────────────────────────────────────────
  admin-server:
    image: ghcr.io/abhishek-puri-goswami/connecthub-backend/admin-server:latest
    build:
      context: .
      dockerfile: admin-server/Dockerfile
    container_name: connecthub-admin
    ports: ["19090:9090"]
    environment:
      EUREKA_HOST: service-registry
      EUREKA_USER: ${EUREKA_USER:-eureka}
      EUREKA_PASSWORD: ${EUREKA_PASSWORD}
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    depends_on:
      service-registry: { condition: service_healthy }
    networks: [connecthub]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  api-gateway:
    image: ghcr.io/abhishek-puri-goswami/connecthub-backend/api-gateway:latest
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    container_name: connecthub-gateway
    ports: ["8080:8080"]
    environment:
      EUREKA_HOST: service-registry
      EUREKA_USER: ${EUREKA_USER:-eureka}
      EUREKA_PASSWORD: ${EUREKA_PASSWORD}
      REDIS_HOST: redis
      JWT_SECRET: ${JWT_SECRET}
      KAFKA_BROKERS: kafka:9092
      ADMIN_SERVER_HOST: admin-server
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      FRONTEND_URL: ${FRONTEND_URL:-https://connecthub-de66f.firebaseapp.com}
      APP_CORS_ALLOWED_ORIGIN: ${FRONTEND_URL:-https://connecthub-de66f.firebaseapp.com}
      ZIPKIN_URL: ${ZIPKIN_URL:-http://zipkin:9411}
      CONFIG_SERVER_HOST: config-server
      CONFIG_SERVER_USER: ${CONFIG_SERVER_USER}
      CONFIG_SERVER_PASSWORD: ${CONFIG_SERVER_PASSWORD}
    depends_on:
      service-registry: { condition: service_healthy }
      admin-server: { condition: service_healthy }
      redis: { condition: service_healthy }
      config-server: { condition: service_healthy }
    restart: on-failure
    networks: [connecthub]

  auth-service:
    image: ghcr.io/abhishek-puri-goswami/connecthub-backend/auth-service:latest
    build:
      context: .
      dockerfile: auth-service/Dockerfile
    container_name: connecthub-auth
    expose: ["8081"]
    environment:
      MYSQL_HOST: mysql
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      REDIS_HOST: redis
      EUREKA_HOST: service-registry
      EUREKA_USER: ${EUREKA_USER:-eureka}
      EUREKA_PASSWORD: ${EUREKA_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      FRONTEND_URL: ${FRONTEND_URL:-https://connecthub-de66f.firebaseapp.com}
      APP_CORS_ALLOWED_ORIGIN: ${FRONTEND_URL:-https://connecthub-de66f.firebaseapp.com}
      KAFKA_BROKERS: kafka:9092
      ADMIN_SERVER_HOST: admin-server
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      PLATFORM_ADMIN_EMAIL: ${PLATFORM_ADMIN_EMAIL}
      PLATFORM_ADMIN_PASSWORD: ${PLATFORM_ADMIN_PASSWORD}
      CONFIG_SERVER_HOST: config-server
      CONFIG_SERVER_USER: ${CONFIG_SERVER_USER}
      CONFIG_SERVER_PASSWORD: ${CONFIG_SERVER_PASSWORD}
    depends_on:
      kafka: { condition: service_healthy }
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
      service-registry: { condition: service_healthy }
      admin-server: { condition: service_healthy }
      config-server: { condition: service_healthy }
    restart: on-failure
    networks: [connecthub]

  room-service:
    image: ghcr.io/abhishek-puri-goswami/connecthub-backend/room-service:latest
    build:
      context: .
      dockerfile: room-service/Dockerfile
    container_name: connecthub-room
    expose: ["8082"]
    environment:
      MYSQL_HOST: mysql
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      EUREKA_HOST: service-registry
      EUREKA_USER: ${EUREKA_USER:-eureka}
      EUREKA_PASSWORD: ${EUREKA_PASSWORD}
      REDIS_HOST: redis
      KAFKA_BROKERS: kafka:9092
      ADMIN_SERVER_HOST: admin-server
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      CONFIG_SERVER_HOST: config-server
      CONFIG_SERVER_USER: ${CONFIG_SERVER_USER}
      CONFIG_SERVER_PASSWORD: ${CONFIG_SERVER_PASSWORD}
    restart: on-failure
    depends_on:
      kafka: { condition: service_healthy }
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
      service-registry: { condition: service_healthy }
      admin-server: { condition: service_healthy }
      config-server: { condition: service_healthy }
    restart: on-failure
    networks: [connecthub]

  message-service:
    image: ghcr.io/abhishek-puri-goswami/connecthub-backend/message-service:latest
    build:
      context: .
      dockerfile: message-service/Dockerfile
    container_name: connecthub-message
    expose: ["8083"]
    environment:
      MYSQL_HOST: mysql
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      EUREKA_HOST: service-registry
      EUREKA_USER: ${EUREKA_USER:-eureka}
      EUREKA_PASSWORD: ${EUREKA_PASSWORD}
      REDIS_HOST: redis
      KAFKA_BROKERS: kafka:9092
      ADMIN_SERVER_HOST: admin-server
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      CONFIG_SERVER_HOST: config-server
      CONFIG_SERVER_USER: ${CONFIG_SERVER_USER}
      CONFIG_SERVER_PASSWORD: ${CONFIG_SERVER_PASSWORD}
    depends_on:
      kafka: { condition: service_healthy }
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
      service-registry: { condition: service_healthy }
      admin-server: { condition: service_healthy }
      config-server: { condition: service_healthy }
    restart: on-failure
    networks: [connecthub]

  media-service:
    image: ghcr.io/abhishek-puri-goswami/connecthub-backend/media-service:latest
    build:
      context: .
      dockerfile: media-service/Dockerfile
    container_name: connecthub-media
    expose: ["8084"]
    environment:
      MYSQL_HOST: mysql
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      REDIS_HOST: redis
      EUREKA_HOST: service-registry
      EUREKA_USER: ${EUREKA_USER:-eureka}
      EUREKA_PASSWORD: ${EUREKA_PASSWORD}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET:-connecthub-media-bucket}
      AWS_REGION: ${AWS_REGION:-ap-south-1}
      KAFKA_BROKERS: kafka:9092
      ADMIN_SERVER_HOST: admin-server
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      CONFIG_SERVER_HOST: config-server
      CONFIG_SERVER_USER: ${CONFIG_SERVER_USER}
      CONFIG_SERVER_PASSWORD: ${CONFIG_SERVER_PASSWORD}
    depends_on:
      kafka: { condition: service_healthy }
      mysql: { condition: service_healthy }
      service-registry: { condition: service_healthy }
      admin-server: { condition: service_healthy }
      config-server: { condition: service_healthy }
    restart: on-failure
    networks: [connecthub]

  presence-service:
    image: ghcr.io/abhishek-puri-goswami/connecthub-backend/presence-service:latest
    build:
      context: .
      dockerfile: presence-service/Dockerfile
    container_name: connecthub-presence
    expose: ["8085"]
    environment:
      REDIS_HOST: redis
      EUREKA_HOST: service-registry
      EUREKA_USER: ${EUREKA_USER:-eureka}
      EUREKA_PASSWORD: ${EUREKA_PASSWORD}
      ADMIN_SERVER_HOST: admin-server
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      CONFIG_SERVER_HOST: config-server
      CONFIG_SERVER_USER: ${CONFIG_SERVER_USER}
      CONFIG_SERVER_PASSWORD: ${CONFIG_SERVER_PASSWORD}
    depends_on:
      redis: { condition: service_healthy }
      service-registry: { condition: service_healthy }
      admin-server: { condition: service_healthy }
      config-server: { condition: service_healthy }
    restart: on-failure
    networks: [connecthub]

  notification-service:
    image: ghcr.io/abhishek-puri-goswami/connecthub-backend/notification-service:latest
    build:
      context: .
      dockerfile: notification-service/Dockerfile
    container_name: connecthub-notification
    expose: ["8086"]
    environment:
      MYSQL_HOST: mysql
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      REDIS_HOST: redis
      EUREKA_HOST: service-registry
      EUREKA_USER: ${EUREKA_USER:-eureka}
      EUREKA_PASSWORD: ${EUREKA_PASSWORD}
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      KAFKA_BROKERS: kafka:9092
      ADMIN_SERVER_HOST: admin-server
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN}
      TWILIO_FROM_NUMBER: ${TWILIO_FROM_NUMBER}
      FIREBASE_SERVICE_ACCOUNT_JSON: ${FIREBASE_SERVICE_ACCOUNT_JSON:-}
      CONFIG_SERVER_HOST: config-server
      CONFIG_SERVER_USER: ${CONFIG_SERVER_USER}
      CONFIG_SERVER_PASSWORD: ${CONFIG_SERVER_PASSWORD}
    depends_on:
      kafka: { condition: service_healthy }
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
      service-registry: { condition: service_healthy }
      admin-server: { condition: service_healthy }
      config-server: { condition: service_healthy }
    restart: on-failure
    networks: [connecthub]

  websocket-service:
    image: ghcr.io/abhishek-puri-goswami/connecthub-backend/websocket-service:latest
    build:
      context: .
      dockerfile: websocket-service/Dockerfile
    container_name: connecthub-websocket
    expose: ["8087"]
    environment:
      REDIS_HOST: redis
      EUREKA_HOST: service-registry
      EUREKA_USER: ${EUREKA_USER:-eureka}
      EUREKA_PASSWORD: ${EUREKA_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      KAFKA_BROKERS: kafka:9092
      ADMIN_SERVER_HOST: admin-server
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      CONFIG_SERVER_HOST: config-server
      CONFIG_SERVER_USER: ${CONFIG_SERVER_USER}
      CONFIG_SERVER_PASSWORD: ${CONFIG_SERVER_PASSWORD}
    depends_on:
      kafka: { condition: service_healthy }
      redis: { condition: service_healthy }
      service-registry: { condition: service_healthy }
      admin-server: { condition: service_healthy }
      config-server: { condition: service_healthy }
    restart: on-failure
    networks: [connecthub]

  payment-service:
    image: ghcr.io/abhishek-puri-goswami/connecthub-backend/payment-service:latest
    build:
      context: .
      dockerfile: payment-service/Dockerfile
    container_name: connecthub-payment
    expose: ["8088"]
    environment:
      MYSQL_HOST: mysql
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      REDIS_HOST: redis
      EUREKA_HOST: service-registry
      EUREKA_USER: ${EUREKA_USER:-eureka}
      EUREKA_PASSWORD: ${EUREKA_PASSWORD}
      KAFKA_BROKERS: kafka:9092
      JWT_SECRET: ${JWT_SECRET}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET}
      ADMIN_SERVER_HOST: admin-server
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      CONFIG_SERVER_HOST: config-server
      CONFIG_SERVER_USER: ${CONFIG_SERVER_USER}
      CONFIG_SERVER_PASSWORD: ${CONFIG_SERVER_PASSWORD}
    depends_on:
      kafka: { condition: service_healthy }
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
      service-registry: { condition: service_healthy }
      admin-server: { condition: service_healthy }
      config-server: { condition: service_healthy }
    restart: on-failure
    networks: [connecthub]

  zipkin:
    image: openzipkin/zipkin:latest
    container_name: connecthub-zipkin
    ports: ["9411:9411"]
    networks: [connecthub]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9411/health"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  mysql_data:
  redis_data:

networks:
  connecthub:
    driver: bridge
