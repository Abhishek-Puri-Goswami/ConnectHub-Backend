server:
  port: 9090
  # Loopback only: services are reached through the gateway on this machine. Set BIND_ADDRESS=0.0.0.0
  # (and EUREKA_INSTANCE_IP to this machine's address) only if you deliberately serve other hosts.
  address: ${BIND_ADDRESS:127.0.0.1}

spring:
  application:
    name: admin-server
  security:
    user:
      name: ${ADMIN_USER:admin}
      password: ${ADMIN_PASSWORD:admin}
  boot:
    admin:
      ui:
        title: "ConnectHub Admin"

eureka:
  client:
    service-url:
      defaultZone: http://${EUREKA_USER:eureka}:${EUREKA_PASSWORD:eureka}@${EUREKA_HOST:localhost}:8761/eureka/
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true
    ip-address: ${EUREKA_INSTANCE_IP:127.0.0.1}
    instance-id: ${spring.application.name}:${server.port}

management:
  endpoints:
    web:
      exposure:
        include: "health,info,metrics,loggers,env"
  endpoint:
    health:
      show-details: never
  info:
    env:
      enabled: true

info:
  app:
    name: ConnectHub Admin Server
    version: 1.0.0




