name: SonarCloud Analysis – Backend

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  sonar:
    name: Build, Test & Analyze
    runs-on: ubuntu-latest

    steps:
      # ── Checkout ────────────────────────────────────────────────────────────
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0          # Full history required for SonarCloud blame

      # ── Java ────────────────────────────────────────────────────────────────
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      # ── Cache SonarCloud packages ────────────────────────────────────────────
      - name: Cache SonarCloud packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      # ── Build, Test & JaCoCo aggregate coverage report ──────────────────────
      # -Djacoco.skip.check=true lets CI build succeed even if coverage < threshold
      # while we're still adding tests. Remove this flag once we hit 85%+.
      # The code-coverage-report module produces:
      #   code-coverage-report/target/site/jacoco-aggregate/jacoco.xml
      - name: Build and run tests with JaCoCo coverage
        run: |
          mvn -B verify \
            -Djacoco.skip.check=true \
            --no-transfer-progress

      # ── Upload JaCoCo coverage report as artifact ────────────────────────────
      - name: Upload JaCoCo aggregate report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jacoco-coverage-report
          path: code-coverage-report/target/site/jacoco-aggregate/
          retention-days: 7

      # ── SonarCloud Scan ──────────────────────────────────────────────────────
      # Reads the JaCoCo XML report produced above.
      # sonar.projectKey and sonar.organization are passed at runtime from secrets
      # so the pom.xml doesn't need to hardcode them.
      - name: SonarCloud Scan
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          mvn -B sonar:sonar \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.organization=${{ secrets.SONAR_ORGANIZATION }} \
            -Dsonar.projectKey=${{ secrets.SONAR_PROJECT_KEY_BACKEND }} \
            -Dsonar.projectName="ConnectHub Backend" \
            -Dsonar.token=${{ secrets.SONAR_TOKEN }} \
            -Dsonar.coverage.jacoco.xmlReportPaths=code-coverage-report/target/site/jacoco-aggregate/jacoco.xml \
            -Dsonar.coverage.exclusions="**/dto/**,**/config/**,**/exception/**,**/entity/**,**/model/**,**/*Application.java" \
            --no-transfer-progress
