name: SonarCloud Analysis – Backend

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  sonar:
    name: Build, Test & Analyze
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Cache SonarCloud packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      # Step 1: Run full verify lifecycle for all modules in reactor order.
      # The code-coverage-report module (last in the reactor) runs jacoco:report-aggregate
      # and produces code-coverage-report/target/site/jacoco-aggregate/jacoco.xml.
      # This file must exist BEFORE sonar:sonar runs — if both goals are in a single
      # "mvn verify sonar:sonar" command, sonar:sonar executes per-module during the
      # reactor pass, so auth-service is analyzed before code-coverage-report has run
      # and the aggregate XML doesn't exist yet. Two steps avoids that ordering problem.
      - name: Build and run tests with JaCoCo coverage
        run: |
          mvn -B verify \
            -Djacoco.skip.check=true \
            --no-transfer-progress

      - name: Upload JaCoCo aggregate report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jacoco-coverage-report
          path: code-coverage-report/target/site/jacoco-aggregate/
          retention-days: 7

      # Step 2: Run SonarCloud scan pointing at the now-complete aggregate XML.
      # $(pwd) gives the absolute runner path so SonarCloud resolves the file
      # correctly for every sub-module (relative paths fail per-module resolution).
      - name: SonarCloud Scan
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          mvn -B sonar:sonar \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.organization=${{ secrets.SONAR_ORGANIZATION }} \
            -Dsonar.projectKey=${{ secrets.SONAR_PROJECT_KEY_BACKEND }} \
            -Dsonar.projectName="ConnectHub Backend" \
            -Dsonar.token=${{ secrets.SONAR_TOKEN }} \
            -Dsonar.coverage.jacoco.xmlReportPaths=$(pwd)/code-coverage-report/target/site/jacoco-aggregate/jacoco.xml \
            -Dsonar.cpd.exclusions="**/*Test.java,**/*Tests.java,**/*IT.java" \
            --no-transfer-progress
