server:
  port: 8084

spring:
  application:
    name: media-service
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:3306/connecthub_media?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: true
  servlet:
    multipart:
      max-file-size: 260MB   # ceiling above the largest plan (PRO 250MB); per-plan limits are enforced by UploadSizeGuardFilter + MediaService
      max-request-size: 262MB
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  kafka:
    bootstrap-servers: ${KAFKA_BROKERS:localhost:9092}
    consumer:
      group-id: media-service-group
      auto-offset-reset: earliest

media:
  # Files are stored on local disk; delete this folder to wipe all uploads.
  storage:
    dir: ${MEDIA_STORAGE_DIR:${user.home}/connecthub-media}
  # Origin the browser uses to reach the api-gateway; stored file URLs are <this>/api/v1/media/file/<id>
  public-base-url: ${MEDIA_PUBLIC_BASE_URL:http://localhost:8080}
  # Secret for signing media-session cookies (shared with the JWT secret on purpose: one secret to manage)
  signing-secret: ${JWT_SECRET}
  # Set true only when the site is served over HTTPS
  cookie-secure: ${MEDIA_COOKIE_SECURE:false}

eureka:
  client:
    service-url:
      defaultZone: http://${EUREKA_USER:eureka}:${EUREKA_PASSWORD:eureka}@${EUREKA_HOST:localhost}:8761/eureka/
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,loggers,env
  endpoint:
    health:
      show-details: always
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_URL:http://zipkin:9411}/api/v2/spans


springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html



