server:
  port: 8761
  # Loopback only: services are reached through the gateway on this machine. Set BIND_ADDRESS=0.0.0.0
  # (and EUREKA_INSTANCE_IP to this machine's address) only if you deliberately serve other hosts.
  address: ${BIND_ADDRESS:127.0.0.1}
spring:
  application:
    name: service-registry
  security:
    user:
      name: ${EUREKA_USER:eureka}
      password: ${EUREKA_PASSWORD:eureka}
  boot:
    admin:
      client:
        url: http://${ADMIN_SERVER_HOST:localhost}:9090
        username: ${ADMIN_USER:admin}
        password: ${ADMIN_PASSWORD:admin}
eureka:
  client:
    register-with-eureka: false
    fetch-registry: false
    service-url:
      defaultZone: http://${EUREKA_USER:eureka}:${EUREKA_PASSWORD:eureka}@localhost:8761/eureka/
  server:
    enable-self-preservation: false
    eviction-interval-timer-in-ms: 5000
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never




